<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0a2a3f"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa8ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#00d1b2" stop-opacity=".9"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1400" height="780" fill="url(#bg)"/>
  <circle cx="405" cy="220" r="180" fill="url(#a)" opacity=".25" filter="url(#glow)"/>
  <circle cx="995" cy="566" r="240" fill="url(#a)" opacity=".18" filter="url(#glow)"/>
  <text x="90" y="315" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="54" font-weight="800" fill="#f5f7ff">Atención por WhatsApp</text>
  <text x="92" y="370" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="26" font-weight="600" fill="rgba(245,247,255,.78)">Soporte rápido y directo cuando lo necesitas.</text>
  <rect x="90" y="430" width="360" height="58" rx="16" fill="url(#a)" opacity=".95"/>
  <text x="120" y="468" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="20" font-weight="800" fill="#0b1220">Iniciar trámite</text>
  <text x="90" y="720" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="16" font-weight="700" fill="rgba(245,247,255,.55)">Slide 3</text>
</svg>